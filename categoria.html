<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Gestor de Categorías</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='css/styles.css'>
    <script src='js/categorias.js'></script>
</head>

<body>
    <main>
        <h1>Gestionar Categorías</h1>

        <!-- Formulario para crear una nueva categoría -->
        <form id="category-form" action="server/category/create.php" method="post" class="my-form">
            <input type="hidden" name="id" id="category-id">

            <label class="field">
                <span><span class="req-field">*</span>Category Name:</span>
                <input type="text" name="name" placeholder="Category name" id="category-name" required />
            </label>

            <label class="field">
                <span><span class="req-field">*</span>Category ID:</span>
                <input type="number" name="category_id" placeholder="Category ID" id="category-id" required />
            </label>

            <button type="submit" id="submit-category-btn">Enviar</button>
        </form>

        <h2>Mis Categorías</h2>
        <!-- Lista de categorías dinámica -->
        <ul id="category-list"></ul>
        
    </main>
</body>

</html>
