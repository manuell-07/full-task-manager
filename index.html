<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Task Manager</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='css/styles.css'>
    <script src='js/app.js'></script>
</head>

<body>
    <main>
        <h1>Gestor de tareas</h1>
        <a href="categoria.html" class="btn-link">+ Crear nueva categoría</a>

        <form id="task-form" action="server/task/create.php" method="post" class="my-form">
            <input type="hidden" name="id" id="task-id">

            
            <label class="field">
                <span><span class="req-field">*</span>Title:</span>
                <input type="text" name="title" placeholder="title" id="title" required />
            </label>

            <label class="field">
                <span>Description:</span>
                <input type="text" name="description" placeholder="description" id="description" />
            </label>

            <label class="field">
                <span>Release date:</span>
                <input type="date" name="due_date" placeholder="due date" id="due_date" />
            </label>

            <label class="field cbx-g">
                <span>Completed?</span>
                <input type="checkbox" name="completed" id="completed" />
            </label>

            <label class="field">
                <span><span class="req-field">*</span>Category id:</span>
                <input type="number" name="category_id" placeholder="category_id" id="category_id" required />
            </label>

            <button type="submit" id="submit-btn">Enviar</button>
        </form>

        <ul id="task-list"></ul>
        
    </main>
</body>

</html>
